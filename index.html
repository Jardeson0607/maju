<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maju do Jacim 🌸</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffeef8 0%, #e8f0fe 50%, #fdf2f8 100%);
      overflow: hidden;
      user-select: none;
    }

    /* Nuvens decorativas de fundo */
    .nuvem {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50px;
      filter: blur(8px);
      z-index: 0;
      animation: flutuarNuvem 18s infinite linear;
    }

    .nuvem-1 { width: 140px; height: 50px; top: 15%; left: -150px; animation-duration: 22s; }
    .nuvem-2 { width: 200px; height: 70px; bottom: 20%; left: -220px; animation-duration: 28s; animation-delay: 5s; }

    /* Card Fofo */
    .card-fofo {
      position: relative;
      z-index: 2;
      background: rgba(255, 255, 255, 0.85);
      padding: 45px 55px;
      border-radius: 40px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 143, 177, 0.2);
      border: 3px solid #fff;
      animation: pulsarSuave 3s ease-in-out infinite;
    }

    /* Nome MAJU */
    .nome-maju {
      font-family: 'Fredoka', cursive;
      font-size: clamp(3.8rem, 14vw, 6.5rem);
      font-weight: 700;
      color: #ff6584;
      text-shadow: 
        3px 3px 0px #ffd3e2,
        6px 6px 0px rgba(255, 182, 193, 0.4);
      letter-spacing: 4px;
      line-height: 1;
      display: inline-block;
    }

    /* Frase Maju do Jacim */
    .frase-jacim {
      font-family: 'Quicksand', sans-serif;
      margin-top: 14px;
      font-size: clamp(1.1rem, 4.5vw, 1.6rem);
      font-weight: 600;
      color: #845ec2;
      background: #fbf0f8;
      padding: 8px 22px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 4px 10px rgba(132, 94, 194, 0.1);
    }

    /* Partículas do toque */
    .coracao-rastro {
      position: fixed;
      pointer-events: none;
      font-size: 1.5rem;
      transform: translate(-50%, -50%);
      animation: flutuarRastro 0.8s forwards ease-out;
      z-index: 3;
    }

    /* Animações */
    @keyframes pulsarSuave {
      0%, 100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-8px) scale(1.02);
      }
    }

    @keyframes flutuarNuvem {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 250px)); }
    }

    @keyframes flutuarRastro {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -100%) scale(1.3) rotate(15deg);
      }
    }
  </style>
</head>
<body>

  <div class="nuvem nuvem-1"></div>
  <div class="nuvem nuvem-2"></div>

  <div class="card-fofo">
    <h1 class="nome-maju">Maju</h1>
    <br>
    <span class="frase-jacim">do Jacim e pronto. 🤍</span>
  </div>

  <script>
    const fofuras = ['💖', '🌸', '✨', '🎀', '🫧', '💕'];

    function soltarFofura(x, y) {
      const item = document.createElement('span');
      item.className = 'coracao-rastro';
      item.innerText = fofuras[Math.floor(Math.random() * fofuras.length)];
      item.style.left = x + 'px';
      item.style.top = y + 'px';

      document.body.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, 800);
    }

    // Touch no celular
    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      soltarFofura(touch.clientX, touch.clientY);
    });

    // Mouse no PC
    window.addEventListener('mousemove', (e) => {
      soltarFofura(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
