<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Majuzinha</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Quicksand:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      touch-action: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ffeef8 0%, #e8f0fe 50%, #fdf2f8 100%);
      overflow: hidden;
      user-select: none;
    }

    /* Nuvens decorativas de fundo */
    .nuvem {
      position: absolute;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 50px;
      filter: blur(8px);
      z-index: 0;
      animation: flutuarNuvem 18s infinite linear;
    }

    .nuvem-1 { width: 140px; height: 50px; top: 15%; left: -150px; animation-duration: 22s; }
    .nuvem-2 { width: 200px; height: 70px; bottom: 20%; left: -220px; animation-duration: 28s; animation-delay: 5s; }

    /* Card com a foto nítida */
    .card-fofo {
      position: relative;
      z-index: 2;
      padding: 55px 40px;
      border-radius: 35px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(255, 105, 180, 0.35);
      border: 4px solid #fff;
      animation: pulsarSuave 3s ease-in-out infinite;
      max-width: 90%;
      width: 360px;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* Deixa o texto mais embaixo */
      align-items: center;
      overflow: hidden;
      background: url('foto.jpeg') center/cover no-repeat;
    }

    /* Camada sutil apenas para garantir leitura */
    .card-fofo::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.45) 0%, rgba(255, 255, 255, 0.1) 60%, transparent 100%);
      z-index: 1;
    }

    .conteudo {
      position: relative;
      z-index: 2;
      width: 100%;
    }

    /* Nome MAJU com contorno branco e sombra */
    .nome-maju {
      font-family: 'Fredoka', cursive;
      font-size: clamp(3.2rem, 13vw, 5.2rem);
      font-weight: 700;
      color: #ff3366;
      -webkit-text-stroke: 2px #fff;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
      letter-spacing: 4px;
      line-height: 1;
      display: inline-block;
    }

    /* Frase Maju do Jacim */
    .frase-jacim {
      font-family: 'Quicksand', sans-serif;
      margin-top: 14px;
      font-size: clamp(1rem, 4.2vw, 1.3rem);
      font-weight: 700;
      color: #fff;
      background: rgba(108, 61, 169, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 8px 20px;
      border-radius: 20px;
      display: inline-block;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
    }

    /* Partículas do toque */
    .coracao-rastro {
      position: fixed;
      pointer-events: none;
      font-size: 1.5rem;
      transform: translate(-50%, -50%);
      animation: flutuarRastro 0.8s forwards ease-out;
      z-index: 3;
    }

    @keyframes pulsarSuave {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.015); }
    }

    @keyframes flutuarNuvem {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 250px)); }
    }

    @keyframes flutuarRastro {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -100%) scale(1.3) rotate(15deg);
      }
    }
  </style>
</head>
<body>

  <div class="nuvem nuvem-1"></div>
  <div class="nuvem nuvem-2"></div>

  <div class="card-fofo">
    <div class="conteudo">
      <h1 class="nome-maju">Maju</h1>
      <br>
      <span class="frase-jacim">do Jacim e pronto. 🤍</span>
    </div>/
  </div>

  <script>
    const fofuras = ['💖', '🌸', '✨', '🎀', '🫧', '💕', '🧸'];

    function soltarFofura(x, y) {
      const item = document.createElement('span');
      item.className = 'coracao-rastro';
      item.innerText = fofuras[Math.floor(Math.random() * fofuras.length)];
      item.style.left = x + 'px';
      item.style.top = y + 'px';

      document.body.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, 800);
    }

    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      soltarFofura(touch.clientX, touch.clientY);
    }, { passive: true });

    window.addEventListener('mousemove', (e) => {
      soltarFofura(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
