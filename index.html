<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maju ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2b0938 0%, #0d0118 100%);
      overflow: hidden;
    }

    .container {
      text-align: center;
      position: relative;
    }

    /* Nome MAJU com efeito 3D, degradê e flutuação */
    .nome-maju {
      font-size: clamp(4rem, 15vw, 9rem);
      font-weight: 900;
      letter-spacing: 12px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff2a85, #ff7300, #ff0055, #ffd000);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(255, 42, 133, 0.7));
      animation: float 3s ease-in-out infinite, gradientShift 6s ease infinite;
      display: inline-block;
    }

    /* Ícone giratório decorativo */
    .estrela {
      display: inline-block;
      font-size: 2rem;
      animation: spin 4s linear infinite;
    }

    /* Frase MAJU LINDINHA piscando estilo neon */
    .frase-lindinha {
      margin-top: 15px;
      font-size: clamp(1.5rem, 5vw, 2.5rem);
      font-weight: 700;
      color: #fff;
      text-shadow: 
        0 0 7px #ff2a85,
        0 0 10px #ff2a85,
        0 0 21px #ff2a85,
        0 0 42px #ff0055;
      animation: piscar 1.2s ease-in-out infinite alternate, pulsar 2s ease-in-out infinite;
    }

    /* Animações */
    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(-1deg);
      }
      50% {
        transform: translateY(-20px) rotate(2deg);
      }
    }

    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes piscar {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        opacity: 1;
        text-shadow: 
          0 0 7px #ff2a85,
          0 0 10px #ff2a85,
          0 0 21px #ff2a85,
          0 0 42px #ff0055;
      }
      20%, 24%, 55% {
        opacity: 0.3;
        text-shadow: none;
      }
    }

    @keyframes pulsar {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div>
      <span class="estrela">✨</span>
      <h1 class="nome-maju">MAJU</h1>
      <span class="estrela">✨</span>
    </div>
    <p class="frase-lindinha">💖 MAJU LINDINHA 💖</p>
  </div>

</body>
</html>
