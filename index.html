<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Maju ✨</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', sans-serif;
      touch-action: none; /* Garante resposta instantânea ao toque */
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #2b0938 0%, #0d0118 100%);
      overflow: hidden;
      user-select: none;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 1;
      pointer-events: none; /* Deixa o toque passar para o fundo */
    }

    /* Nome MAJU */
    .nome-maju {
      font-size: clamp(3.5rem, 14vw, 8.5rem);
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      background: linear-gradient(45deg, #ff2a85, #ff7300, #ff0055, #ffd000);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(255, 42, 133, 0.7));
      animation: float 3s ease-in-out infinite, gradientShift 6s ease infinite;
      display: inline-block;
    }

    .estrela {
      display: inline-block;
      font-size: 1.8rem;
      animation: spin 4s linear infinite;
    }

    /* Frase MAJU DO JACIM */
    .frase-jacim {
      margin-top: 15px;
      font-size: clamp(1.4rem, 5vw, 2.3rem);
      font-weight: 700;
      letter-spacing: 2px;
      color: #fff;
      text-shadow: 
        0 0 7px #ff2a85,
        0 0 10px #ff2a85,
        0 0 21px #ff2a85,
        0 0 42px #ff0055;
      animation: piscar 1.2s ease-in-out infinite alternate, pulsar 2s ease-in-out infinite;
    }

    /* Partículas do rastro estilo cobra */
    .cobra-ponto {
      position: fixed;
      pointer-events: none;
      font-size: 1.4rem;
      transform: translate(-50%, -50%);
      animation: sumirCobra 0.7s forwards ease-out;
      z-index: 2;
      filter: drop-shadow(0 0 6px #ff007f);
    }

    /* Animações */
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-18px) rotate(2deg); }
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes piscar {
      0%, 18%, 22%, 25%, 53%, 57%, 100% {
        opacity: 1;
        text-shadow: 
          0 0 7px #ff2a85,
          0 0 10px #ff2a85,
          0 0 21px #ff2a85,
          0 0 42px #ff0055;
      }
      20%, 24%, 55% {
        opacity: 0.35;
        text-shadow: none;
      }
    }

    @keyframes pulsar {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes sumirCobra {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div>
      <span class="estrela">✨</span>
      <h1 class="nome-maju">MAJU</h1>
      <span class="estrela">✨</span>
    </div>
    <p class="frase-jacim">💖 MAJU DO JACIM 💖</p>
  </div>

  <script>
    const emojis = ['💖', '✨', '🌸', '💫'];

    function criarRastro(x, y) {
      const ponto = document.createElement('span');
      ponto.className = 'cobra-ponto';
      ponto.innerText = emojis[Math.floor(Math.random() * emojis.length)];
      ponto.style.left = x + 'px';
      ponto.style.top = y + 'px';

      document.body.appendChild(ponto);

      setTimeout(() => {
        ponto.remove();
      }, 700);
    }

    // Eventos para celular (touch) e computador (mouse)
    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      criarRastro(touch.clientX, touch.clientY);
    });

    window.addEventListener('mousemove', (e) => {
      criarRastro(e.clientX, e.clientY);
    });
  </script>
</body>
</html>
